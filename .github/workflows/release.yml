name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A tag is permanent and a release made from one is public. Running the tests here rather than
  # trusting that they were run on the commit the tag names is the difference between a release
  # that was checked and one that was tagged from a branch where somebody skipped the pull request.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the history between this tag and the last one to write the release
          # notes; a shallow clone gives it nothing to read and the notes come out empty.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
