name: selfsweep

# The whole module, weekly rather than per pull request. A full sweep is thousands of trials and
# every one is a compile, so it belongs somewhere it can take as long as it takes without standing
# between a contributor and a review.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # "go run ." rather than the installed binary the README tells users to run: what this job
      # measures is the commit that triggered it, and an installed mutest would measure it with
      # whichever version the module proxy last served.
      #
      # A ceiling rather than a target, and a ratchet rather than a standard. Measured at 1030 on
      # 2026-09-18 — 734 survivors and 296 sites no test runs — so this catches the module getting
      # meaningfully worse without failing every week over a handful of mutants that land
      # differently on a runner than on a laptop. Lower it as findings are dealt with; a job that
      # cannot fail is not a check, and one that fails every week stops being read.
      #
      # The previous figure of 1163 was measured over six of the nine packages: trial's baseline
      # was being reported as a failing suite, which settles every mutant there as unmeasured and
      # counts none of them here. It is measured now, so this number covers the whole module and is
      # not comparable with the one it replaces.
      - run: go run . -results mutants.json -disk-floor 1GiB -cache-budget 4GiB -fail-on 1100
      # This job runs on a schedule and nowhere else, so this is the one action no pull request
      # exercises, and "if: always()" means a broken upload sits behind a step that still passes.
      # Kept current by hand for that reason rather than left on whatever version once worked.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants
          path: mutants.json*
          if-no-files-found: warn
